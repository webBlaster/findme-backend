<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geolocation Broadcast - Web Client</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        width: 100%;
        padding: 40px;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        text-align: center;
      }

      .subtitle {
        color: #666;
        text-align: center;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .section {
        margin-bottom: 30px;
      }

      .section-title {
        font-weight: 600;
        color: #333;
        margin-bottom: 15px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }

      input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      button {
        padding: 12px 24px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }

      button:hover {
        background: #5568d3;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .status {
        padding: 12px;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom: 15px;
      }

      .status.connected {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .status.disconnected {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .messages {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        padding: 15px;
        max-height: 300px;
        overflow-y: auto;
        font-size: 12px;
        font-family: "Monaco", "Courier New", monospace;
      }

      .message {
        margin-bottom: 10px;
        padding: 8px;
        background: white;
        border-left: 3px solid #667eea;
        border-radius: 3px;
      }

      .message.info {
        border-left-color: #17a2b8;
      }

      .message.warning {
        border-left-color: #ffc107;
      }

      .message.error {
        border-left-color: #dc3545;
      }

      .timestamp {
        color: #999;
        font-size: 11px;
        margin-right: 8px;
      }

      .coords {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 15px;
      }

      .coord-input {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .coord-input label {
        font-size: 12px;
        color: #666;
        font-weight: 600;
      }

      .coord-input input {
        padding: 8px;
        font-size: 13px;
      }

      .location-button {
        background: #28a745;
      }

      .location-button:hover {
        background: #218838;
      }

      .clients-list {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        padding: 12px;
        font-size: 13px;
      }

      .client-item {
        padding: 8px;
        background: white;
        margin-bottom: 8px;
        border-radius: 4px;
        border-left: 3px solid #667eea;
      }

      .client-id {
        font-family: "Monaco", monospace;
        color: #667eea;
        font-weight: 600;
        font-size: 11px;
      }

      .client-location {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🌍 Geolocation Broadcast</h1>
      <p class="subtitle">Real-time location sharing via WebSocket</p>

      <!-- Room Management -->
      <div class="section">
        <div class="section-title">Room Management</div>
        <div class="input-group">
          <input
            type="text"
            id="roomId"
            placeholder="Enter room ID or leave blank to create new"
          />
          <button onclick="createOrJoinRoom()">Create/Join Room</button>
        </div>
        <div id="status" class="status disconnected">🔴 Disconnected</div>
      </div>

      <!-- Location Input -->
      <div class="section" id="locationSection" style="display: none">
        <div class="section-title">Your Location</div>
        <div class="coords">
          <div class="coord-input">
            <label>Latitude</label>
            <input
              type="number"
              id="latitude"
              step="0.0001"
              placeholder="e.g., 40.7128"
            />
          </div>
          <div class="coord-input">
            <label>Longitude</label>
            <input
              type="number"
              id="longitude"
              step="0.0001"
              placeholder="e.g., -74.0060"
            />
          </div>
        </div>
        <button class="location-button" onclick="sendLocation()">
          📍 Send Location
        </button>
        <button onclick="getUserLocation()" style="margin-left: 10px">
          📡 Use Current Location
        </button>
      </div>

      <!-- Messages Log -->
      <div class="section">
        <div class="section-title">Activity Log</div>
        <div id="messages" class="messages"></div>
        <button onclick="clearMessages()" style="margin-top: 10px; width: 100%">
          Clear Log
        </button>
      </div>

      <!-- Connected Clients -->
      <div class="section" id="clientsSection" style="display: none">
        <div class="section-title">Connected Clients</div>
        <div id="clientsList" class="clients-list"></div>
      </div>
    </div>

    <script>
      let ws = null;
      let clientId = null;
      let roomId = null;
      let connectedClients = new Map();

      function log(message, type = "info") {
        const messagesDiv = document.getElementById("messages");
        const messageEl = document.createElement("div");
        messageEl.className = `message ${type}`;
        const timestamp = new Date().toLocaleTimeString();
        messageEl.innerHTML = `<span class="timestamp">${timestamp}</span>${message}`;
        messagesDiv.appendChild(messageEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function clearMessages() {
        document.getElementById("messages").innerHTML = "";
      }

      async function createOrJoinRoom() {
        const roomInput = document.getElementById("roomId").value.trim();

        try {
          if (!roomInput) {
            // Create new room
            const response = await fetch("http://localhost:8000/api/rooms", {
              method: "POST",
            });
            const data = await response.json();
            roomId = data.roomId;
            log(`✅ Created room: ${roomId}`, "info");
          } else {
            roomId = roomInput;
            log(`📍 Joining room: ${roomId}`, "info");
          }

          document.getElementById("roomId").value = roomId;
          connectWebSocket(roomId);
        } catch (error) {
          log(`❌ Error: ${error.message}`, "error");
        }
      }

      function connectWebSocket(roomId) {
        if (ws) {
          ws.close();
        }

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/ws/${roomId}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          log("🔌 Connected to room", "info");
          updateStatus(true);
          document.getElementById("locationSection").style.display = "block";
          document.getElementById("clientsSection").style.display = "block";
        };

        ws.onmessage = (event) => {
          const message = JSON.parse(event.data);

          if (message.type === "location") {
            const loc = message.location;
            const clientId = message.clientId;

            // Store client location
            connectedClients.set(clientId, {
              id: clientId,
              location: loc,
            });

            log(
              `📍 ${clientId.substring(0, 8)}: (${loc.latitude.toFixed(4)}, ${loc.longitude.toFixed(4)})`,
              "info",
            );
            updateClientsList();
          } else if (message.type === "client-joined") {
            log(
              `👋 Client joined: ${message.clientId.substring(0, 8)}`,
              "info",
            );
            updateClientsList();
          } else if (message.type === "client-left") {
            connectedClients.delete(message.clientId);
            log(`👋 Client left: ${message.clientId.substring(0, 8)}`, "info");
            updateClientsList();
          }
        };

        ws.onerror = (error) => {
          log("❌ WebSocket error", "error");
          updateStatus(false);
        };

        ws.onclose = () => {
          log("🔌 Disconnected", "warning");
          updateStatus(false);
          connectedClients.clear();
          updateClientsList();
        };
      }

      function sendLocation() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          log("❌ Not connected to a room", "error");
          return;
        }

        const lat = parseFloat(document.getElementById("latitude").value);
        const lon = parseFloat(document.getElementById("longitude").value);

        if (isNaN(lat) || isNaN(lon)) {
          log("❌ Invalid latitude or longitude", "error");
          return;
        }

        const message = {
          type: "location",
          latitude: lat,
          longitude: lon,
          accuracy: Math.random() * 20,
        };

        ws.send(JSON.stringify(message));
        log(`📍 Sent location: (${lat.toFixed(4)}, ${lon.toFixed(4)})`, "info");
      }

      function getUserLocation() {
        if (!navigator.geolocation) {
          log("❌ Geolocation not supported", "error");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            document.getElementById("latitude").value =
              position.coords.latitude;
            document.getElementById("longitude").value =
              position.coords.longitude;
            log("📡 Got your current location", "info");
          },
          (error) => {
            log(`❌ Geolocation error: ${error.message}`, "error");
          },
        );
      }

      function updateStatus(connected) {
        const statusDiv = document.getElementById("status");
        if (connected) {
          statusDiv.className = "status connected";
          statusDiv.textContent = "🟢 Connected";
        } else {
          statusDiv.className = "status disconnected";
          statusDiv.textContent = "🔴 Disconnected";
        }
      }

      function updateClientsList() {
        const listDiv = document.getElementById("clientsList");
        listDiv.innerHTML = "";

        if (connectedClients.size === 0) {
          listDiv.innerHTML =
            '<p style="color: #999;">No other clients connected</p>';
          return;
        }

        for (const [id, client] of connectedClients) {
          const clientEl = document.createElement("div");
          clientEl.className = "client-item";
          clientEl.innerHTML = `
            <div class="client-id">${id.substring(0, 8)}...</div>
            <div class="client-location">
              📍 ${client.location.latitude.toFixed(4)}, ${client.location.longitude.toFixed(4)}
              <span style="color: #999; font-size: 11px;">(±${client.location.accuracy.toFixed(1)}m)</span>
            </div>
          `;
          listDiv.appendChild(clientEl);
        }
      }

      // Initialize
      log("Welcome to Geolocation Broadcast!", "info");
      log("Create or join a room to get started", "info");
    </script>
  </body>
</html>
